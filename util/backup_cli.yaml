# Parallels VM Backup CLI Configuration
# Generated by: backup_cli init
# Date: 2025-11-26 11:25:24

# RESTORE ON A NEW MACHINE (backup location)
#   Azure subscription: personalinfra (personal account, az login)
#   Storage account:    stlocaldevbackupppozdl5m
#   Container:          parallels-vm
#   VM backup:          parallels-vm/Ubuntu 24.04.3 ARM64.pvm/   (full disk, 2026-11-18)
#   Other archives:     parallels-vm/macos_backup_2026-11/       (devel code, ~/.claude, creds; 2026-11-14)
#   Steps:
#     1. brew install rclone azure-cli
#     2. az login && az account set --subscription personalinfra
#     3. clone dotfiles; rclone config create azure-backup azureblob account=stlocaldevbackupppozdl5m env_auth=true
#        (do NOT run ./backup_cli init: it overwrites this file)
#     4. ./backup_cli pull --dry-run, then ./backup_cli pull   (downloads to ~/ParallelsRestore)
#     5. archives: rclone copy "azure-backup:parallels-vm/macos_backup_2026-11" ~/macos_backup

azure:
  storage_account: stlocaldevbackupppozdl5m
  container: parallels-vm
  rclone_remote: azure-backup

parallels:
  vm_name: Ubuntu
  vm_dir: ~/Parallels

restore:
  dest_dir: ~/ParallelsRestore

options:
  suspend_before_push: true
  resume_after_push: true
  transfers: 4
  checkers: 8
  bandwidth_limit: "15M"
  # Exclude active .hds file (the one currently being written to)
  # When true, backup represents last SmartGuard snapshot state
  # Faster backups, but lose changes since last snapshot on restore
  # This is to avoid annoying issue:  suspend VM will always change current
  #  disk file, which every time after suspend VM need to upload ~6G file
  exclude_active_hds: false

# Sync rounds - files synced in order by max size
# Each round syncs files up to that size, final round syncs all remaining
sync_rounds:
  - 3G
  - 6G
  - 20G
